<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Editor — Andrea Franceschetto</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="app">
  <header class="tb">
    <div class="tb-l">
      <strong>Editor</strong>
      <span id="status" class="chip">…</span>
    </div>
    <div class="tb-r">
      <button class="btn btn--ghost" id="btn-undo" title="Annulla (Ctrl/Cmd+Z fuori dai campi di testo)">↶ Annulla</button>
      <button class="btn btn--ghost" id="btn-redo" title="Ripeti">↷ Ripeti</button>
      <span class="sep"></span>
      <button class="btn btn--ghost" id="btn-pv-toggle">Anteprima</button>
      <button class="btn btn--ghost" id="btn-export" title="Scarica una copia di content.json">Esporta JSON</button>
      <button class="btn btn--ghost" id="btn-settings">Collegamento GitHub</button>
      <button class="btn btn--primary" id="btn-publish">Pubblica</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div class="main">
    <nav class="sb" id="sidebar" aria-label="Pagine e progetti"></nav>
    <section class="fm" id="form"></section>
    <section class="pv" id="preview-wrap">
      <div class="pv-bar">
        <div class="seg">
          <button id="dev-desktop" class="on">Desktop</button>
          <button id="dev-mobile">Mobile</button>
        </div>
        <span id="pv-route" class="pv-route"></span>
      </div>
      <div class="pv-stage" id="pv-stage"><iframe id="pv-frame" title="Anteprima"></iframe></div>
    </section>
  </div>
</div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="admin.js"></script>
</body>
</html>
